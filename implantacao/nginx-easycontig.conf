# EasyContig BR — proxy reverso.
#
# ⚠️ Este arquivo esta em HTTP ate o certificado existir. O `certbot --nginx`
# acrescenta os blocos 443 e o redirecionamento. Motivo de nao ja vir com 443:
# nginx nao valida um bloco `ssl` sem certificado, entao ele nem subiria -- e
# sem nginx no ar o desafio HTTP-01 nao tem por onde entrar. Ovo e galinha.
#
# ⚠️ nginx 1.22 (bookworm): `http2 on;` NAO existe, e sintaxe do 1.25+. Aqui e
# `listen 443 ssl http2;`. Descoberto tentando.
#
# O compose publica em 127.0.0.1:8000 de proposito: quem fala com a internet e
# este nginx, nunca o conteiner direto.

server {
    server_name easycontigbr.com.br;

    # O desafio HTTP-01 entra por aqui e NAO pode ser redirecionado para https,
    # senao a RENOVACAO quebra quando o certificado vencer -- o pior momento
    # possivel para descobrir. O certbot preserva esta location.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # ⚠️ O teto de corpo e RESTRITIVO por padrao e so afrouxa na rota que
    # precisa. Ate 2026-08-21 este 512m valia para o servidor inteiro, e o
    # achado F2 daquela varredura mostrou o preco: `POST /entrar` nao exige
    # sessao, entao um anonimo mandava ~330 partes de quase 1 MiB, o parser do
    # FastAPI segurava tudo em RAM antes de a rota poder recusar, e o OOM
    # killer do host derrubava o que estivesse pela frente. O app agora recusa
    # em 64 KB (MAX_CORPO_SEM_SESSAO), e aqui fica a mesma decisao na borda:
    # quem nao e rota de envio nao passa de 2m.
    client_max_body_size 2m;

    # Um lote de 40 amostras leva ~26 s no pior caso medido, e o upload de 26 MB
    # segura a conexao; os 60 s padrao cortariam envio grande.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Estas valem para TODAS as `location` abaixo -- nginx herda `proxy_*` do
    # bloco `server`. Ficam aqui para que acrescentar uma location de upload nao
    # exija copiar os cabecalhos, que e como se perde um deles sem perceber.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # ⚠️ CONTRATO COM O `limites.py`: ele caminha o X-Forwarded-For da
    # DIREITA para a esquerda pulando os proxies declarados em
    # EASYCONTIG_PROXIES_CONFIAVEIS. Portanto aqui se ACRESCENTA
    # ($proxy_add_x_forwarded_for), nunca se sobrescreve -- sobrescrever
    # devolveria o teto por IP contornavel que a ADR 0054 fechou.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    # SSE da pagina do lote: sem isto o navegador so recebe o progresso
    # quando o buffer do nginx enche.
    proxy_buffering off;

    # As tres rotas que recebem arquivo, cada uma com o teto que a APLICACAO ja
    # cobra -- a borda nao deve ser mais frouxa que o app, senao o 413 vem sem a
    # mensagem que explica cota. `location =` e casamento exato: so o envio em
    # si afrouxa, `/lotes/{id}/...` cai no padrao.
    # 330 KB por .ab1 e ate 400 arquivos por lote (EASYCONTIG_MAX_BYTES, 300 MB
    # + folga de multipart).
    location = /lotes {
        client_max_body_size 512m;
        proxy_pass http://127.0.0.1:8000;
    }
    # FASTA de banco proprio: a rota recusa acima de 20 MB.
    location = /bancos/meu {
        client_max_body_size 32m;
        proxy_pass http://127.0.0.1:8000;
    }
    # Foto de perfil: a rota recusa acima de 2 MB; 8m cobre a foto mais o resto
    # do formulario.
    location = /perfil {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/easycontigbr.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/easycontigbr.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


# Porta 80: o desafio ACME por `location`, NAO por `if` de servidor.
# O `if` do certbot roda na fase de rewrite, ANTES do casamento de location, e
# por isso engolia /.well-known/acme-challenge/. Funciona hoje so porque o Lets
# Encrypt segue redirecionamento -- mas o lugar onde isso quebra e a RENOVACAO,
# daqui a 60 dias, sem ninguem olhando.
server {
    listen 80;
    listen [::]:80;
    server_name easycontigbr.com.br www.easycontigbr.com.br;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://easycontigbr.com.br$request_uri; }
}

# www -> sem-www, em HTTPS. O certbot nao faz isto: o redirecionamento dele
# preserva o host, entao https://www servia o app direto. Importa porque a URI
# de redirecionamento do Google esta cadastrada so para o dominio raiz, e sessao
# em www e sessao em outro host.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.easycontigbr.com.br;
    ssl_certificate /etc/letsencrypt/live/easycontigbr.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easycontigbr.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://easycontigbr.com.br$request_uri;
}
