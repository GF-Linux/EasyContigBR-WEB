[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easycontig-web"
version = "0.1.0"
description = "Fachada web do EasyContig BR: processamento de corridas Sanger em lote"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    # o núcleo científico, instalado do repo do EasyContig (ADR 0050).
    # Em desenvolvimento: pip install -e ../EasyContig-BR-Demo-Deck
    "easycontig-br-core",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "itsdangerous>=2.1",
    # A FIGURA da árvore (`processamento/executor_de_arvore.py`). Fica deste
    # lado, e não no núcleo, pelo mesmo motivo que o Qt não está lá: quem
    # instala `app/core` num servidor não deve baixar uma pilha de gráficos.
    # A ciência da árvore não depende disto -- sem matplotlib saem o Newick e o
    # .con.tre do mesmo jeito, e a tela só perde a imagem.
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
# ⚠️ Listado um a um, e não `find_packages`: subpacote esquecido aqui some da
# imagem do Docker e o erro só aparece DENTRO do contêiner — em desenvolvimento
# o `pip install -e .` põe a pasta no caminho e mascara a falta.
packages = [
    "easycontig_web",
    "easycontig_web.contas",
    "easycontig_web.dados",
    "easycontig_web.processamento",
    "easycontig_web.web",
]

[tool.setuptools.package-data]
easycontig_web = ["templates/*.html", "estatico/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
