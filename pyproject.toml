[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easycontig-web"
version = "0.1.0"
description = "Fachada web do EasyContig BR: processamento de corridas Sanger em lote"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    # o núcleo científico, instalado do repo do EasyContig (ADR 0050).
    # Em desenvolvimento: pip install -e ../EasyContig-BR-Demo-Deck
    "easycontig-br-core",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["easycontig_web"]

[tool.setuptools.package-data]
easycontig_web = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
