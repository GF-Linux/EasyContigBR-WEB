[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easycontig-web"
version = "0.2.0"
description = "EasyContig BR: montagem, identificação e árvore de corridas Sanger em lote, e a fachada web que as serve"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    # As bibliotecas do núcleo. O original as recebia por tabela, pelo pacote
    # `easycontig-br-core` (o repo da demo); com o núcleo dentro deste
    # repositório elas vêm aqui, senão a imagem sobe e morre na primeira
    # leitura de .ab1 (Bio.SeqIO no orientacao.py) ou na primeira árvore
    # (pyfamsa e dendropy no filogenia.py). O MrBayes (`mb`) não é pip: o
    # Dockerfile o compila.
    "biopython>=1.83",
    "pyfamsa>=0.5",
    "dendropy>=4.5",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "itsdangerous>=2.1",
    # A FIGURA da árvore (processamento/executor_de_arvore.py). Fica do lado da
    # web, e não no núcleo: o filogenia.py não importa matplotlib, e sem ele o
    # Newick e o .con.tre saem do mesmo jeito — a tela só perde a imagem.
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# O playwright é do teste_oficina.py (o oficina.js num Chromium de verdade);
# o navegador vem à parte: `playwright install chromium`.
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.45"]

[tool.setuptools]
# O núcleo são módulos soltos na raiz do repositório, e o pip só leva o que
# está listado aqui: módulo novo na raiz precisa entrar nesta lista, senão a
# imagem sobe sem ele e o erro só aparece dentro do contêiner (em
# desenvolvimento o `pip install -e .` põe a pasta no caminho e mascara a falta).
py-modules = [
    "ferramentas",
    "motor_tracy",
    "pareamento",
    "orientacao",
    "montagem",
    "identificacao",
    "relatorio",
    "lote",
    "tracado",
    "filogenia",
    "cliente_ncbi",
    "bancos_de_referencia",
]
# Pela mesma razão, os subpacotes da web um a um, e não `find_packages`.
packages = [
    "easycontig_web",
    "easycontig_web.contas",
    "easycontig_web.dados",
    "easycontig_web.processamento",
    "easycontig_web.web",
]

[tool.setuptools.package-data]
# O favicon entra junto: a lista antiga só levava o .js, e o ícone faltava na imagem.
easycontig_web = ["templates/*.html", "estatico/*.js", "estatico/*.svg"]

[tool.pytest.ini_options]
# Os arquivos chamam-se teste_*.py (o prefixo em português), e o pythonpath
# aponta para a raiz para a suíte rodar sem instalar o pacote.
testpaths = ["tests"]
python_files = ["teste_*.py"]
pythonpath = ["."]
