  <polygon points="801,295 801,305 812,300" fill="#1C7C2E"/>
  <text x="788" y="290" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="10.5" fill="#1C7C2E">3 vagas</text>
