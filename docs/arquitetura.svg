<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 830" width="1120" height="830" role="img" aria-label="Fluxo do EasyContig web: o navegador envia .ab1 pelo nginx ao servidor_web, que grava no volume e enfileira no SQLite; o trabalhador reivindica o lote e roda tracy, blastn e MrBayes pelo núcleo, os módulos na raiz do repositório.">
  <rect x="0" y="0" width="1120" height="830" fill="#FFFFFF"/>
  <text x="60" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#7E819A" letter-spacing="1.6">EASYCONTIG BR — WEB (LOTES) · COMO ESTÁ MONTADO</text>
  <rect x="60" y="60" width="280" height="120" rx="10" fill="#F5F5FA" stroke="#B9BACD" stroke-width="1.5"/>
  <text x="200.0" y="90" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1B1C28">navegador</text>
  <text x="200.0" y="114" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">envia os .ab1 (par F+R</text>
  <text x="200.0" y="132" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">ou a pasta da corrida) e</text>
  <text x="200.0" y="150" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">pergunta o status (polling)</text>
  <rect x="400" y="60" width="360" height="120" rx="10" fill="#F5F5FA" stroke="#B9BACD" stroke-width="1.5"/>
  <text x="580.0" y="90" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1B1C28">nginx · borda</text>
  <text x="580.0" y="114" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">TLS certbot · 443 → 127.0.0.1:8000</text>
  <text x="580.0" y="132" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">teto de corpo POR ROTA:</text>
  <text x="580.0" y="150" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">2m padrão; 512m só em = /lotes</text>
  <rect x="820" y="60" width="260" height="250" rx="10" fill="#F5F5FA" stroke="#1C7C2E" stroke-width="2"/>
  <text x="950.0" y="90" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1C7C2E">núcleo (raiz do repo)</text>
  <text x="848" y="114" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">o mesmo nos dois processos</text>
  <text x="848" y="132" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63"></text>
  <text x="848" y="150" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">  tracy</text>
  <text x="848" y="168" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">  blastn</text>
  <text x="848" y="186" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">  árvore NJ</text>
  <text x="848" y="204" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">  MrBayes</text>
  <text x="848" y="222" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63"></text>
  <text x="848" y="240" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">nenhuma decisão</text>
  <text x="848" y="258" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">científica mora aqui</text>
  <rect x="400" y="240" width="360" height="140" rx="10" fill="#F5F5FA" stroke="#5B4FB0" stroke-width="2"/>
  <text x="580.0" y="270" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1B1C28">servidor_web.py</text>
  <text x="580.0" y="294" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">grava, ENFILEIRA e responde</text>
  <text x="580.0" y="312" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">116 ms para um envio de 26 MB</text>
  <text x="580.0" y="330" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">NÃO processa nada do lote</text>
  <rect x="60" y="460" width="320" height="170" rx="10" fill="#F5F5FA" stroke="#B9BACD" stroke-width="1.5"/>
  <text x="220.0" y="490" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1B1C28">/dados (o volume)</text>
  <text x="82" y="514" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">lotes/&lt;id&gt;/entrada/  os .ab1</text>
  <text x="82" y="532" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">lotes/&lt;id&gt;/trabalho/ tracy</text>
  <text x="82" y="550" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">lotes/&lt;id&gt;/arvore/   MrBayes</text>
  <text x="82" y="568" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">lotes/&lt;id&gt;/relatorio.html</text>
  <text x="82" y="586" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">lotes/&lt;id&gt;/relatorio.json</text>
  <text x="82" y="604" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">lotes/&lt;id&gt;/resultado.csv</text>
  <text x="82" y="622" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">bancos/  ·  fotos/</text>
  <rect x="440" y="460" width="320" height="170" rx="10" fill="#F5F5FA" stroke="#B9BACD" stroke-width="1.5"/>
  <text x="600.0" y="490" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1B1C28">fila.sqlite3 (WAL)</text>
  <text x="466" y="514" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">DUAS filas na mesma base:</text>
  <text x="466" y="532" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">  lotes</text>
  <text x="466" y="550" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">  arvores</text>
  <text x="466" y="568" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">e mais perfis, pedidos</text>
  <text x="466" y="586" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">e o pulso dos trabalhadores</text>
  <text x="466" y="604" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63"></text>
  <text x="466" y="622" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">metadado — nunca o traço</text>
  <rect x="60" y="700" width="700" height="100" rx="10" fill="#F5F5FA" stroke="#B9BACD" stroke-width="1.5"/>
  <text x="410.0" y="730" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#1B1C28">trabalhador_da_fila × N — a mesma imagem do web</text>
  <text x="410.0" y="754" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">pega um LOTE; não havendo, uma ÁRVORE · o UPDATE condicional dá o lote a um só</text>
  <text x="410.0" y="772" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" fill="#4B4E63">os ~14 s de uma corrida de 40 amostras acontecem aqui, fora da requisição</text>
