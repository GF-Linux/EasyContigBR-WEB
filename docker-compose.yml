# Docker Compose desde o primeiro dia (ADR 0050): é o que torna a entrega à
# universidade possível. Quem assumir o serviço precisa conseguir subir tudo com
# um comando, sem reconstruir o ambiente a partir da memória do autor.
#
#   docker compose up -d --build
#
# Antes: ponha os bancos BLAST curados em ./bancos (referencias_18S.*,
# referencias_16S.*) e a EASYCONTIG_SECRET_KEY no .env. O núcleo está neste
# repositório e entra na imagem com o COPY do Dockerfile — não há passo de
# preparar nada.

services:
  web:
    build: &build
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # atrás de um proxy reverso com TLS, nunca exposto direto
    environment: &ambiente
      # ⚠️ A TRAVA DE ARRANQUE, LIGADA. Ela recusa subir em modo `dev`, sem
      # SECRET_KEY, sem HTTPS_ONLY, sem URL_BASE ou sem ninguém ter decidido
      # quem entra (configuracao.conferir_producao). As cinco condições são
      # satisfeitas pelas linhas abaixo — mas SECRET_KEY e URL_BASE vêm do
      # `.env`, então é lá que elas precisam estar de verdade.
      EASYCONTIG_PRODUCAO: "1"
      EASYCONTIG_DATA_DIR: /dados
      EASYCONTIG_DB_18S: /bancos/referencias_18S
      EASYCONTIG_DB_16S: /bancos/referencias_16S
      EASYCONTIG_TRACY_BIN: /usr/local/bin/tracy
      EASYCONTIG_TRIM: "4"
      # ⚠️ Sem estas linhas o contêiner cai nos padrões do código, e dois deles
      # não são cosméticos:
      #   RETENCAO_DIAS ausente = 0 = GUARDAR PARA SEMPRE. A política de 30 dias
      #     do laboratório não valeria, e o volume cresceria em silêncio.
      #   URL_BASE ausente = o endereço de volta do Google sairia do cabeçalho
      #     `Host`, que quem faz a requisição escolhe; ele é também o espelho
      #     da checagem de origem dos POST (defesa de CSRF), daí ser trava de
      #     arranque.
      # As de cota e taxa caem em padrões sãos; estão aqui para o `.env` do
      # servidor valer em vez de ser ignorado sem nada dizer.
      EASYCONTIG_RETENCAO_DIAS: ${EASYCONTIG_RETENCAO_DIAS:-30}
      EASYCONTIG_URL_BASE: ${EASYCONTIG_URL_BASE:-}
      EASYCONTIG_MAX_LOTES_ATIVOS: ${EASYCONTIG_MAX_LOTES_ATIVOS:-10}
      EASYCONTIG_MAX_BYTES_CONTA: ${EASYCONTIG_MAX_BYTES_CONTA:-2147483648}
      EASYCONTIG_LIM_ENVIO: ${EASYCONTIG_LIM_ENVIO:-20}
      EASYCONTIG_LIM_LEITURA: ${EASYCONTIG_LIM_LEITURA:-300}
      EASYCONTIG_LIM_BANCO: ${EASYCONTIG_LIM_BANCO:-10}
      EASYCONTIG_LIM_LOGIN: ${EASYCONTIG_LIM_LOGIN:-20}
      # Quantas remontagens (tracy/blastn) o WEB aceita ao mesmo tempo. 3, e
      # não o padrão 4 do código, porque esta caixa tem 2 vCPU e o trabalhador
      # disputa as mesmas: 3 no web + o trabalhador já é o dobro de processos
      # que de núcleos, e passar disso troca "uma rota lenta" por "o site
      # inteiro parado". Quem exceder leva 503 na hora, sem segurar thread do
      # threadpool — que é o recurso que o resto do site usa.
      EASYCONTIG_MAX_PESADAS: ${EASYCONTIG_MAX_PESADAS:-3}
      EASYCONTIG_AUTH: google
      EASYCONTIG_DOMINIO: ${EASYCONTIG_DOMINIO:-ufrrj.br}
      EASYCONTIG_SECRET_KEY: ${EASYCONTIG_SECRET_KEY:?defina no .env — sem ela as sessões caem a cada reinício}
      EASYCONTIG_HTTPS_ONLY: "1"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # De onde o proxy reverso chega. Vazio = `X-Forwarded-For` é ignorado, que
      # é o padrão seguro: o cabeçalho é escrito pelo cliente e, aceito de
      # qualquer um, torna todo teto por IP contornável (medido em 06/08).
      EASYCONTIG_PROXIES_CONFIAVEIS: ${EASYCONTIG_PROXIES_CONFIAVEIS:-}
      # Quem pode remover banco de referência compartilhado. Vazio = ninguém.
      EASYCONTIG_ADMINS: ${EASYCONTIG_ADMINS:-}
    volumes: &volumes
      # Caminho no HOSPEDEIRO, nao volume nomeado, e por duas razoes concretas:
      # (1) o `tools/backup.sh` documenta este caminho, e com volume nomeado o
      #     backup teria de saber que os dados moram em
      #     /var/lib/docker/volumes/easycontig_dados/_data -- que ninguem
      #     adivinha, e que `docker compose down -v` apaga;
      # (2) as ADRs 0050/0057 prometem que migrar para a UFRRJ e "copiar uma
      #     pasta". Isto e a pasta.
      # ⚠️ Ela precisa ser do UID 10001 (o `easycontig` do Dockerfile), senao
      # o conteiner sobe e morre com PermissionError em /dados/lotes.
      #   mkdir -p /var/lib/easycontig && chown 10001:10001 /var/lib/easycontig
      - /var/lib/easycontig:/dados
      - ./bancos:/bancos:ro
    # O /saude responde 503 quando falta tracy, blastn ou índice de banco, e o
    # `urlopen` levanta — é isso que derruba a checagem. Não há reinício
    # automático por unhealthy no compose: o contêiner fica MARCADO, e quem
    # opera vê no `ps`.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/saude').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # O trabalhador é o que faz a conta da ADR 0050 fechar: os ~26 s de um lote de
  # 40 amostras acontecem AQUI, e não numa conexão HTTP aberta.
  #
  # `replicas` é o botão de vazão: cada réplica come ~1 núcleo (0,65 s de CPU por
  # amostra, medido). Numa VPS de 4 vCPU, 3 é o ponto razoável — sobra um para o
  # web. Eles disputam a mesma fila em SQLite e o UPDATE condicional garante que
  # cada lote é de um trabalhador só.
  trabalhador:
    build: *build
    restart: unless-stopped
    command: ["python", "-m", "easycontig_web.processamento.trabalhador_da_fila"]
    environment: *ambiente
    volumes: *volumes
    depends_on:
      - web
    # O trabalhador trata SIGTERM terminando o lote em curso, e o padrão do
    # Docker é matar 10 s depois. Um lote de 40 amostras leva ~26 s (medido):
    # com o padrão, TODO `docker compose down` matava um lote no meio. Não se
    # perdia dado — `reenfileirar_orfaos` devolve à fila no arranque — mas o
    # trabalho era refeito e a corrida voltava ao começo na tela de quem estava
    # esperando. 120 s cobre o maior lote que a cota permite com folga.
    stop_grace_period: 120s
    deploy:
      replicas: ${TRABALHADORES:-2}

# ⚠️ A SUB-REDE E FIXA DE PROPOSITO. O `EASYCONTIG_PROXIES_CONFIAVEIS` guarda o
# endereco de onde o proxy reverso chega ao conteiner, que e o GATEWAY desta
# rede. Sem fixar, o Docker escolhe a sub-rede livre no momento da criacao: um
# `docker compose down` seguido de `up` pode devolver outra faixa, o gateway
# muda, e a variavel passa a apontar para um endereco que nao existe.
#
# O efeito disso NAO e um erro visivel -- e o `X-Forwarded-For` deixar de ser
# confiavel e todo visitante anonimo voltar a dividir um balde so de limite:
# um estranho tranca o login do laboratorio inteiro a ~2 req/min. Nada quebra,
# ninguem percebe. Por isso o numero e escrito aqui e nao descoberto a cada
# subida.
networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
